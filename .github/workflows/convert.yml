name: Compile sing-box SRS

on:
  push:
    branches: [main, master]
    paths:
      - rules.txt
      - .github/workflows/convert.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Install sing-box
        run: GOBIN="$RUNNER_TEMP" go install github.com/sagernet/sing-box/cmd/sing-box@latest

      - name: Convert rules.txt to sing-box rule-set
        run: |
          python3 - <<'PY'
          import ipaddress
          import json
          from pathlib import Path

          ip_cidrs = []
          domain_regex = []

          for line_number, raw_line in enumerate(Path("rules.txt").read_text().splitlines(), 1):
              entry = raw_line.strip()
              if not entry or entry.startswith("#"):
                  continue

              if entry.startswith("regex:"):
                  pattern = entry.removeprefix("regex:").strip()
                  if not pattern:
                      raise SystemExit(f"rules.txt:{line_number}: regex pattern is empty")
                  domain_regex.append(pattern)
                  continue

              try:
                  if "/" in entry:
                      ip_cidrs.append(str(ipaddress.ip_network(entry)))
                  else:
                      address = ipaddress.ip_address(entry)
                      ip_cidrs.append(f"{address}/{address.max_prefixlen}")
              except ValueError as error:
                  raise SystemExit(f"rules.txt:{line_number}: invalid rule {entry!r}: {error}")

          rule = {}
          if ip_cidrs:
              rule["ip_cidr"] = ip_cidrs
          if domain_regex:
              rule["domain_regex"] = domain_regex
          if not rule:
              raise SystemExit("rules.txt contains no rules")

          Path("rules.json").write_text(
              json.dumps({"version": 1, "rules": [rule]}, indent=2) + "\n"
          )
          PY

      - name: Compile rule-set
        run: "$RUNNER_TEMP/sing-box rule-set compile --output bypass.srs rules.json"

      - name: Commit and push generated SRS
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add bypass.srs
          if git diff --cached --quiet; then
            echo "bypass.srs is already up to date"
          else
            git commit -m "Auto-update bypass.srs"
            git push
          fi
