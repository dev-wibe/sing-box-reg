name: Compile sing-box rule sets

on:
  push:
    branches: [main, master]
    paths:
      - input/**/*.txt
      - .github/workflows/convert.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Install sing-box
        run: GOBIN="$RUNNER_TEMP" go install github.com/sagernet/sing-box/cmd/sing-box@latest

      - name: Convert input TXT files to SRS
        env:
          SING_BOX: ${{ runner.temp }}/sing-box
        run: |
          python3 - <<'PY'
          import ipaddress
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          input_dir = Path("input")
          output_dir = Path("release/sing-box")
          source_files = sorted(input_dir.rglob("*.txt")) if input_dir.exists() else []
          if not source_files:
              raise SystemExit("No .txt files found in input/")

          expected_outputs = {
              source.relative_to(input_dir).with_suffix(".srs")
              for source in source_files
          }
          output_dir.mkdir(parents=True, exist_ok=True)

          for old_output in output_dir.rglob("*.srs"):
              if old_output.relative_to(output_dir) not in expected_outputs:
                  old_output.unlink()

          with tempfile.TemporaryDirectory() as temp_dir:
              temp_dir = Path(temp_dir)
              for index, source in enumerate(source_files):
                  ip_cidrs = []
                  domain_regex = []

                  for line_number, raw_line in enumerate(
                      source.read_text(encoding="utf-8").splitlines(), 1
                  ):
                      entry = raw_line.strip()
                      if not entry or entry.startswith("#"):
                          continue

                      if entry.startswith("regex:"):
                          pattern = entry.removeprefix("regex:").strip()
                          if not pattern:
                              raise SystemExit(
                                  f"{source}:{line_number}: regex pattern is empty"
                              )
                          domain_regex.append(pattern)
                          continue

                      try:
                          if "/" in entry:
                              ip_cidrs.append(str(ipaddress.ip_network(entry)))
                          else:
                              address = ipaddress.ip_address(entry)
                              ip_cidrs.append(
                                  f"{address}/{address.max_prefixlen}"
                              )
                      except ValueError as error:
                          raise SystemExit(
                              f"{source}:{line_number}: invalid rule "
                              f"{entry!r}: {error}"
                          )

                  rule = {}
                  if ip_cidrs:
                      rule["ip_cidr"] = ip_cidrs
                  if domain_regex:
                      rule["domain_regex"] = domain_regex
                  if not rule:
                      raise SystemExit(f"{source}: contains no rules")

                  source_json = temp_dir / f"{index}.json"
                  source_json.write_text(
                      json.dumps(
                          {"version": 1, "rules": [rule]}, indent=2
                      ) + "\n",
                      encoding="utf-8",
                  )

                  relative_output = source.relative_to(input_dir).with_suffix(".srs")
                  output = output_dir / relative_output
                  output.parent.mkdir(parents=True, exist_ok=True)
                  subprocess.run(
                      [
                          os.environ["SING_BOX"],
                          "rule-set",
                          "compile",
                          "--output",
                          str(output),
                          str(source_json),
                      ],
                      check=True,
                  )
                  print(f"Compiled {source} -> {output}")
          PY

      - name: Commit and push generated SRS files
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add -A -- release/sing-box
          if git diff --cached --quiet; then
            echo "Generated SRS files are already up to date"
          else
            git commit -m "Update compiled sing-box rule sets"
            git push
          fi
