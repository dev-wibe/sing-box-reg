name: Compile sing-box SRS

on:
  push:
    branches: [ main, master ]
    paths:
      - 'rules.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Initialize Go module & Install sing-box
        run: |
          go mod init srs-compiler || true
          go install -v github.com/sagernet/sing-box/cmd/sing-box@latest

      - name: Compile rules.txt to bypass.srs
        run: |
          $(go env GOPATH)/bin/sing-box rule-set compile rules.txt -o bypass.srs

      - name: Commit and Push generated .srs file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add bypass.srs
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update bypass.srs" && git push)
